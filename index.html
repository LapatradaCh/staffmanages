<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการเจ้าหน้าที่ในหน่วยงาน</title>
    
    <!-- เชื่อมโยงไฟล์ CSS ภายนอก -->
    <link rel="stylesheet" href="StaffManagement.css">
    
    <!-- Tailwind CSS (สำหรับการจัด Layout ที่แตกต่างกัน 4 แบบ) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8f9fa; }
        
        /* UX/UI Color Conventions */
        .btn-confirm { background-color: #059669 !important; color: white !important; } /* Emerald 600 */
        .btn-confirm:hover { background-color: #047857 !important; }
        .btn-danger { background-color: #e11d48 !important; color: white !important; } /* Rose 600 */
        .btn-danger:hover { background-color: #be123c !important; }
        .text-danger { color: #e11d48 !important; }
        
        /* Hide element utility */
        .hidden { display: none !important; }
        
        /* Modal Backdrop */
        .modal-backdrop {
            position: fixed; inset: 0; background-color: rgba(0,0,0,0.5);
            z-index: 1000; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .modal-backdrop.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: white; border-radius: 1rem; width: 100%; max-width: 28rem;
            transform: translateY(20px); transition: transform 0.2s;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .modal-backdrop.active .modal-content { transform: translateY(0); }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="text-slate-800">

    <!-- Top Navigation & Design Switcher -->
    <div class="fixed top-0 left-0 right-0 h-16 bg-white border-b border-slate-200 z-50 px-6 flex items-center justify-between shadow-sm">
        <div class="font-bold text-lg flex items-center gap-2">
            <i data-lucide="users" class="text-indigo-600"></i> ระบบจัดการบุคลากร
        </div>
        <div class="relative">
            <button onclick="toggleDesignMenu()" class="flex items-center gap-2 px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg hover:bg-slate-100 font-medium text-sm transition-colors focus:ring-2 focus:ring-indigo-500 outline-none">
                <i data-lucide="layout" class="w-4 h-4"></i>
                <span id="currentDesignLabel">Design 1: Standard Tabs</span>
                <i data-lucide="chevron-down" class="w-4 h-4"></i>
            </button>
            
            <div id="designMenu" class="hidden absolute right-0 mt-2 w-64 bg-white border border-slate-200 rounded-xl shadow-lg overflow-hidden flex-col">
                <div class="px-4 py-2 bg-slate-50 text-xs font-semibold text-slate-500 border-b border-slate-200">เลือกโครงสร้างเลย์เอาต์</div>
                <button onclick="switchDesign(1)" class="design-btn w-full text-left px-4 py-3 text-sm hover:bg-slate-50 flex items-center gap-3 border-b border-slate-100" data-id="1">
                    <i data-lucide="app-window" class="w-4 h-4 text-slate-400"></i> 1. Standard Tabs
                </button>
                <button onclick="switchDesign(2)" class="design-btn w-full text-left px-4 py-3 text-sm hover:bg-slate-50 flex items-center gap-3 border-b border-slate-100" data-id="2">
                    <i data-lucide="columns" class="w-4 h-4 text-slate-400"></i> 2. Command Center Split
                </button>
                <button onclick="switchDesign(3)" class="design-btn w-full text-left px-4 py-3 text-sm hover:bg-slate-50 flex items-center gap-3 border-b border-slate-100" data-id="3">
                    <i data-lucide="table" class="w-4 h-4 text-slate-400"></i> 3. Enterprise Portal Table
                </button>
                <button onclick="switchDesign(4)" class="design-btn w-full text-left px-4 py-3 text-sm hover:bg-slate-50 flex items-center gap-3" data-id="4">
                    <i data-lucide="trello" class="w-4 h-4 text-slate-400"></i> 4. Minimal Column Board
                </button>
            </div>
        </div>
    </div>

    <!-- Main Content Container (Rendered by JS) -->
    <main id="appContainer" class="pt-24 pb-12 px-4 md:px-8 max-w-7xl mx-auto"></main>

    <!-- ================= MODALS (Shared across all designs) ================= -->
    
    <!-- 1. QR Code Modal -->
    <div id="qrModal" class="modal-backdrop">
        <div class="modal-content overflow-hidden">
            <div class="p-5 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-lg">QR Code เชิญเจ้าหน้าที่</h3>
                <button onclick="closeModal('qrModal')" class="text-slate-400 hover:text-slate-600"><i data-lucide="x"></i></button>
            </div>
            <div class="p-6 flex flex-col items-center">
                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-4">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://traffy.in.th/join" alt="QR Code" class="w-48 h-48">
                </div>
                <div class="w-full bg-slate-50 p-3 rounded-lg border border-slate-200 flex items-center justify-between mb-4">
                    <span class="text-sm text-slate-500 truncate">https://traffy.in.th/join</span>
                    <button onclick="alert('คัดลอกลิงก์แล้ว')" class="text-indigo-600 hover:text-indigo-800"><i data-lucide="copy" class="w-4 h-4"></i></button>
                </div>
                <button onclick="closeModal('qrModal')" class="w-full py-2 rounded-lg font-semibold bg-white border border-slate-300 hover:bg-slate-50">ปิดหน้าต่าง</button>
            </div>
        </div>
    </div>

    <!-- 2. Edit Data Modal -->
    <div id="editModal" class="modal-backdrop">
        <div class="modal-content overflow-hidden">
            <div class="p-5 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-lg">แก้ไขข้อมูลเจ้าหน้าที่</h3>
                <button onclick="closeModal('editModal')" class="text-slate-400 hover:text-slate-600"><i data-lucide="x"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">ชื่อ - นามสกุล</label>
                    <input type="text" id="editName" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">เบอร์โทรศัพท์</label>
                    <input type="text" id="editPhone" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div class="flex gap-3 mt-6">
                    <button onclick="closeModal('editModal')" class="flex-1 py-2.5 rounded-lg font-semibold border border-slate-300 hover:bg-slate-50">ยกเลิก</button>
                    <button onclick="saveEdit()" class="flex-1 py-2.5 rounded-lg font-semibold btn-confirm shadow-sm">บันทึกข้อมูล</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. Responsibilities Modal -->
    <div id="respModal" class="modal-backdrop">
        <div class="modal-content overflow-hidden">
            <div class="p-5 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-lg">กำหนดความรับผิดชอบ</h3>
                <button onclick="closeModal('respModal')" class="text-slate-400 hover:text-slate-600"><i data-lucide="x"></i></button>
            </div>
            <div class="p-6">
                <p class="text-sm text-slate-500 mb-4">เลือกด้านที่เจ้าหน้าที่ท่านนี้รับผิดชอบ (เลือกได้มากกว่า 1)</p>
                <div class="space-y-2 mb-6">
                    <label class="flex items-center p-3 border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-50">
                        <input type="checkbox" class="w-5 h-5 text-indigo-600 rounded focus:ring-indigo-500" checked>
                        <span class="ml-3 font-medium">เรื่องร้องเรียนทั่วไป (ความสะอาด/ขยะ)</span>
                    </label>
                    <label class="flex items-center p-3 border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-50">
                        <input type="checkbox" class="w-5 h-5 text-indigo-600 rounded focus:ring-indigo-500">
                        <span class="ml-3 font-medium">โครงสร้างพื้นฐาน (ถนน/ไฟฟ้า/ประปา)</span>
                    </label>
                    <label class="flex items-center p-3 border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-50">
                        <input type="checkbox" class="w-5 h-5 text-indigo-600 rounded focus:ring-indigo-500">
                        <span class="ml-3 font-medium">เหตุฉุกเฉินและภัยพิบัติ</span>
                    </label>
                </div>
                <div class="flex gap-3">
                    <button onclick="closeModal('respModal')" class="flex-1 py-2.5 rounded-lg font-semibold border border-slate-300 hover:bg-slate-50">ยกเลิก</button>
                    <button onclick="closeModal('respModal')" class="flex-1 py-2.5 rounded-lg font-semibold btn-confirm shadow-sm">บันทึกการตั้งค่า</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Application Logic -->
    <script>
        // --- State Management ---
        let currentDesign = 1;
        let menuOpen = false;
        let dropdownOpenId = null;
        let editingId = null;

        // Mock Data
        let staffData = [
            { id: 1, name: 'สมชาย ใจดี', role: 'admin', phone: '081-111-1111' },
            { id: 2, name: 'สมหญิง รักสงบ', role: 'staff', phone: '082-222-2222' },
            { id: 3, name: 'มานะ ขยันเรียน', role: 'staff', phone: '083-333-3333' }
        ];

        let pendingRequests = [
            { id: 101, name: 'วารี สายน้ำ', phone: '089-999-9999', date: 'วันนี้ 10:30' },
            { id: 102, name: 'นภา เมฆสี', phone: '088-888-8888', date: 'เมื่อวาน 15:45' }
        ];

        const designNames = [
            "", 
            "Design 1: Standard Tabs", 
            "Design 2: Command Center Split", 
            "Design 3: Enterprise Portal Table", 
            "Design 4: Minimal Column Board"
        ];

        // --- Core Functions (Requirements 4, 6, 7, 8) ---
        
        function approveRequest(id) {
            const req = pendingRequests.find(r => r.id === id);
            pendingRequests = pendingRequests.filter(r => r.id !== id);
            staffData.push({ id: req.id, name: req.name, phone: req.phone, role: 'staff' });
            renderApp();
        }

        function rejectRequest(id) {
            pendingRequests = pendingRequests.filter(r => r.id !== id);
            renderApp();
        }

        function promoteStaff(id) {
            staffData = staffData.map(s => s.id === id ? { ...s, role: 'admin' } : s);
            renderApp();
        }

        function demoteStaff(id) {
            staffData = staffData.map(s => s.id === id ? { ...s, role: 'staff' } : s);
            renderApp();
        }

        function removeStaff(id) {
            if(confirm('คุณแน่ใจหรือไม่ที่จะยกเลิกการเป็นเจ้าหน้าที่ของบุคคลนี้?')) {
                staffData = staffData.filter(s => s.id !== id);
                renderApp();
            }
        }

        // --- Modals ---
        function openModal(modalId) { document.getElementById(modalId).classList.add('active'); }
        function closeModal(modalId) { document.getElementById(modalId).classList.remove('active'); }
        function openQrModal() { openModal('qrModal'); }
        function openRespModal(id) { closeAllDropdowns(); openModal('respModal'); }
        
        function openEditModal(id) {
            closeAllDropdowns();
            editingId = id;
            const staff = staffData.find(s => s.id === id);
            document.getElementById('editName').value = staff.name;
            document.getElementById('editPhone').value = staff.phone;
            openModal('editModal');
        }

        function saveEdit() {
            const newName = document.getElementById('editName').value;
            const newPhone = document.getElementById('editPhone').value;
            staffData = staffData.map(s => s.id === editingId ? { ...s, name: newName, phone: newPhone } : s);
            closeModal('editModal');
            renderApp();
        }

        // --- Dropdown Management ---
        function toggleActionMenu(id, e) {
            e.stopPropagation();
            dropdownOpenId = dropdownOpenId === id ? null : id;
            renderApp();
        }
        function closeAllDropdowns() {
            dropdownOpenId = null;
            renderApp();
        }
        window.addEventListener('click', () => { if(dropdownOpenId) closeAllDropdowns(); });

        // --- Design Switcher ---
        function toggleDesignMenu() {
            menuOpen = !menuOpen;
            const menu = document.getElementById('designMenu');
            menuOpen ? menu.classList.remove('hidden') : menu.classList.add('hidden');
        }
        
        function switchDesign(id) {
            currentDesign = id;
            document.getElementById('currentDesignLabel').innerText = designNames[id];
            document.querySelectorAll('.design-btn').forEach(btn => {
                btn.dataset.id == id ? btn.classList.add('bg-slate-900', 'text-white') : btn.classList.remove('bg-slate-900', 'text-white');
            });
            toggleDesignMenu();
            renderApp();
        }

        // --- Render Engines for 4 Designs ---
        function renderApp() {
            const container = document.getElementById('appContainer');
            if (currentDesign === 1) container.innerHTML = templateDesign1();
            if (currentDesign === 2) container.innerHTML = templateDesign2();
            if (currentDesign === 3) container.innerHTML = templateDesign3();
            if (currentDesign === 4) container.innerHTML = templateDesign4();
            lucide.createIcons();
        }

        // Action Menu Template (Reusable across designs)
        function getActionMenu(staff) {
            return `
                <div class="relative inline-block text-left">
                    <button onclick="toggleActionMenu(${staff.id}, event)" class="p-2 hover:bg-slate-100 rounded-full text-slate-500 transition-colors">
                        <i data-lucide="more-vertical" class="w-5 h-5"></i>
                    </button>
                    ${dropdownOpenId === staff.id ? `
                        <div class="absolute right-0 mt-2 w-56 bg-white border border-slate-200 rounded-xl shadow-lg z-10 py-1">
                            <button onclick="openEditModal(${staff.id})" class="w-full text-left px-4 py-2 text-sm hover:bg-slate-50 flex items-center gap-2">
                                <i data-lucide="edit" class="w-4 h-4 text-slate-400"></i> แก้ไขข้อมูล
                            </button>
                            <button onclick="openRespModal(${staff.id})" class="w-full text-left px-4 py-2 text-sm hover:bg-slate-50 flex items-center gap-2">
                                <i data-lucide="check-square" class="w-4 h-4 text-slate-400"></i> ระบุความรับผิดชอบ
                            </button>
                            ${staff.role === 'admin' 
                                ? `<button onclick="demoteStaff(${staff.id})" class="w-full text-left px-4 py-2 text-sm hover:bg-slate-50 flex items-center gap-2"><i data-lucide="arrow-down" class="w-4 h-4 text-slate-400"></i> ลดสถานะเป็นเจ้าหน้าที่</button>`
                                : `<button onclick="promoteStaff(${staff.id})" class="w-full text-left px-4 py-2 text-sm hover:bg-slate-50 flex items-center gap-2"><i data-lucide="arrow-up" class="w-4 h-4 text-slate-400"></i> เพิ่มเป็นผู้ดูแล</button>`
                            }
                            <div class="border-t border-slate-100 my-1"></div>
                            <button onclick="removeStaff(${staff.id})" class="w-full text-left px-4 py-2 text-sm text-danger hover:bg-rose-50 flex items-center gap-2 font-medium">
                                <i data-lucide="user-x" class="w-4 h-4"></i> ยกเลิกเป็นเจ้าหน้าที่
                            </button>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // ================= DESIGN 1: Standard Tabs (Base Requirement) =================
        function templateDesign1() {
            let html = `
                <div class="flex justify-between items-end mb-6">
                    <div><h1 class="text-2xl font-bold">จัดการเจ้าหน้าที่</h1><p class="text-slate-500 text-sm mt-1">โครงสร้าง 1: แยกแท็บ (Tab View)</p></div>
                    <button onclick="openQrModal()" class="btn-confirm flex items-center gap-2 px-4 py-2 rounded-lg font-semibold shadow-sm"><i data-lucide="qr-code" class="w-4 h-4"></i> QR Code เชิญ</button>
                </div>
                
                ${pendingRequests.length > 0 ? `
                <div class="bg-amber-50 border border-amber-200 rounded-xl p-5 mb-8">
                    <h3 class="font-bold text-amber-800 mb-4 flex items-center gap-2"><i data-lucide="bell" class="w-5 h-5"></i> คำขอรออนุมัติ (${pendingRequests.length})</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${pendingRequests.map(req => `
                            <div class="bg-white p-4 rounded-lg border border-amber-100 shadow-sm flex justify-between items-center">
                                <div>
                                    <div class="font-bold">${req.name}</div>
                                    <div class="text-xs text-slate-500 mt-1"><i data-lucide="phone" class="inline w-3 h-3"></i> ${req.phone}</div>
                                </div>
                                <div class="flex gap-2">
                                    <button onclick="rejectRequest(${req.id})" class="btn-danger p-2 rounded-lg"><i data-lucide="x" class="w-4 h-4"></i></button>
                                    <button onclick="approveRequest(${req.id})" class="btn-confirm p-2 rounded-lg"><i data-lucide="check" class="w-4 h-4"></i></button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>` : ''}

                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    ${staffData.map(staff => `
                        <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm relative hover:shadow-md transition-shadow">
                            <div class="absolute top-4 right-4">${getActionMenu(staff)}</div>
                            <div class="w-12 h-12 rounded-full ${staff.role === 'admin' ? 'bg-indigo-100 text-indigo-600' : 'bg-slate-100 text-slate-600'} flex items-center justify-center font-bold text-xl mb-4">
                                ${staff.name.charAt(0)}
                            </div>
                            <h3 class="font-bold text-lg">${staff.name}</h3>
                            <div class="mt-2 mb-4">
                                <span class="px-2.5 py-1 text-xs font-semibold rounded-full ${staff.role === 'admin' ? 'bg-indigo-50 text-indigo-700' : 'bg-emerald-50 text-emerald-700'}">
                                    ${staff.role === 'admin' ? 'ผู้ดูแลระบบ' : 'เจ้าหน้าที่'}
                                </span>
                            </div>
                            <div class="flex items-center gap-2 text-sm text-slate-500 border-t border-slate-100 pt-4">
                                <i data-lucide="phone" class="w-4 h-4"></i> ${staff.phone}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            return html;
        }

        // ================= DESIGN 2: Command Center Split =================
        function templateDesign2() {
            return `
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-2xl font-bold">บุคลากร (Command Center)</h1>
                    <button onclick="openQrModal()" class="btn-confirm flex items-center gap-2 px-4 py-2 rounded-lg font-semibold shadow-sm"><i data-lucide="user-plus" class="w-4 h-4"></i> เชิญร่วมงาน</button>
                </div>
                <div class="flex flex-col lg:flex-row gap-6 items-start">
                    <!-- Left: Staff List -->
                    <div class="w-full lg:w-2/3 bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
                        <div class="p-4 border-b border-slate-200 bg-slate-50 font-bold">รายชื่อในหน่วยงาน</div>
                        <div class="divide-y divide-slate-100">
                            ${staffData.map(staff => `
                                <div class="p-4 flex items-center justify-between hover:bg-slate-50 transition-colors">
                                    <div class="flex items-center gap-4">
                                        <div class="w-10 h-10 rounded-full ${staff.role === 'admin' ? 'bg-indigo-600' : 'bg-emerald-600'} text-white flex items-center justify-center font-bold">${staff.name.charAt(0)}</div>
                                        <div>
                                            <div class="font-bold text-slate-800">${staff.name}</div>
                                            <div class="text-xs text-slate-500">${staff.phone} • ${staff.role === 'admin' ? 'ผู้ดูแล' : 'เจ้าหน้าที่'}</div>
                                        </div>
                                    </div>
                                    ${getActionMenu(staff)}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <!-- Right: Pending -->
                    <div class="w-full lg:w-1/3 space-y-6">
                        <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
                            <div class="p-4 border-b border-slate-200 bg-slate-50 font-bold flex justify-between">
                                คำขอรออนุมัติ <span class="bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full text-xs">${pendingRequests.length}</span>
                            </div>
                            <div class="p-4 space-y-4">
                                ${pendingRequests.length === 0 ? '<div class="text-center text-slate-400 text-sm py-4">ไม่มีคำขอใหม่</div>' : 
                                pendingRequests.map(req => `
                                    <div class="border border-slate-200 rounded-lg p-3">
                                        <div class="font-bold text-sm">${req.name}</div>
                                        <div class="text-xs text-slate-500 mb-3">${req.phone}</div>
                                        <div class="flex gap-2">
                                            <button onclick="approveRequest(${req.id})" class="flex-1 btn-confirm py-1.5 rounded text-xs font-semibold">อนุมัติ</button>
                                            <button onclick="rejectRequest(${req.id})" class="flex-1 btn-danger py-1.5 rounded text-xs font-semibold">ปฏิเสธ</button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // ================= DESIGN 3: Enterprise Portal Table =================
        function templateDesign3() {
            return `
                <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
                    <div class="p-6 border-b border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-4">
                        <div>

                    </div>
                    
                    ${pendingRequests.length > 0 ? `

                                    <th class="px-6 py-4 font-semibold">เบอร์โทรศัพท์</th>

                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                                ${staffData.map(staff => `

                            </tbody>

                    </div>
                </div>

        }

            return `

                    <div class="bg-slate-100/50 rounded-2xl p-4 border border-slate-200 border-dashed">

                        </h3>
                        <div class="space-y-3">
                            ${admins.map(staff => `
                                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex justify-between items-start group">

                            `).join('')}

                    </div>

                    <!-- Column 3: Staff -->
                    <div class="bg-emerald-50/30 rounded-2xl p-4 border border-emerald-100">
                        <h3 class="font-bold text-sm text-emerald-800 mb-4 uppercase tracking-wider flex justify-between">
                            เจ้าหน้าที่ <span class="bg-emerald-100 px-2 rounded-full">${staffs.length}</span>
                        </h3>
                        <div class="space-y-3">
                            ${staffs.map(staff => `
                                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex justify-between items-start group">
                                    <div>
                                        <div class="font-bold">${staff.name}</div>
                                        <div class="text-xs text-slate-400 mt-1">${staff.phone}</div>
                                    </div>
                                    <div class="opacity-0 group-hover:opacity-100 transition-opacity">${getActionMenu(staff)}</div>
                                </div>

        // Initialize First Render
        switchDesign(1);
    </script>
